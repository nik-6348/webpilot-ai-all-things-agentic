services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: webpilot, POSTGRES_PASSWORD: webpilot, POSTGRES_DB: webpilot }
    healthcheck: { test: ["CMD-SHELL","pg_isready -U webpilot"], interval: 3s, timeout: 3s, retries: 20 }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  demo-portal:
    build: { context: ., dockerfile: docker/demo.Dockerfile }
    ports: ["4200:4200"]
  browser-worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    depends_on: { postgres: { condition: service_healthy }, demo-portal: { condition: service_started } }
    environment: &common
      DATABASE_URL: postgresql://webpilot:webpilot@postgres:5432/webpilot
      DIRECT_URL: postgresql://webpilot:webpilot@postgres:5432/webpilot
      LOCAL_ARTIFACTS: "true"
      LOCAL_SECRETS: "true"
      LOCAL_PUBSUB: "true"
      LOCAL_TASKS: "true"
      LOCAL_SCHEDULER: "true"
      ALLOW_PRIVATE_DEMO: "true"
      MOCK_AI: "true"
      GEMINI_MODEL: gemini-3.7-flash
      INTERNAL_WORKER_TOKEN: dev-worker-token
      LOCAL_DATA_DIR: /tmp/webpilot
    ports: ["4100:4100"]
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    depends_on: { postgres: { condition: service_healthy }, browser-worker: { condition: service_started } }
    environment:
      <<: *common
      PORT: 4000
      LOCAL_AUTH_BYPASS: "true"
      LOCAL_USER_EMAIL: demo@webpilot.local
      WORKER_URL: http://browser-worker:4100
      API_PUBLIC_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]
  notifier:
    build: { context: ., dockerfile: docker/notifier.Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment: { <<: *common, PORT: 4300 }
    ports: ["4300:4300"]
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [api]
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_LOCAL_AUTH_BYPASS: "true"
    ports: ["3000:3000"]
volumes: { pgdata: {} }
