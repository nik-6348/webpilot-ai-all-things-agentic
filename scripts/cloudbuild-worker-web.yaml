substitutions:
  _REPO: us-central1-docker.pkg.dev/webpilot-ai-hackathon/webpilot
  _SHA: latest
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""

steps:
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build -f docker/worker.Dockerfile -t "${_REPO}/worker:${_SHA}" .
        docker build -f docker/web.Dockerfile \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${_FIREBASE_API_KEY}" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${_FIREBASE_PROJECT_ID}" \
          -t "${_REPO}/web:${_SHA}" .
        docker push "${_REPO}/worker:${_SHA}"
        docker push "${_REPO}/web:${_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
