substitutions:
  _REPO: us-central1-docker.pkg.dev/webpilot-ai-hackathon/webpilot
  _SHA: latest

steps:
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build -f docker/worker.Dockerfile -t "${_REPO}/worker:${_SHA}" .
        docker build -f docker/api.Dockerfile -t "${_REPO}/api:${_SHA}" .
        docker push "${_REPO}/worker:${_SHA}"
        docker push "${_REPO}/api:${_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
